scenarios:
  - name: "Posted vendor bill propagates operating unit to move and all move lines"
    steps:
      - step: "Get expense account type"
        action: "ref"
        xml_id: "account.data_account_type_expenses"
        save_as: "expense_acc_type"

      - step: "Create expense account"
        action: "create"
        model: "account.account"
        save_as: "expense_account"
        values:
          code: "EVAL: 'VBOUX%d' % env['account.account'].search_count([])"
          name: "Vendor Bill OU Test Expense"
          user_type_id: "REC: expense_acc_type.id"

      - step: "Create vendor partner"
        action: "create"
        model: "res.partner"
        save_as: "vendor"
        values:
          name: "Test Vendor Bill OU Partner 1"
          is_company: true

      - step: "Create partner for operating unit A"
        action: "create"
        model: "res.partner"
        save_as: "ou_partner"
        values:
          name: "Test Vendor Bill OU-A Partner 1"

      - step: "Create operating unit A"
        action: "create"
        model: "operating.unit"
        save_as: "ou"
        values:
          name: "Test Vendor Bill OU-A 1"
          code: "VBOUA1"
          partner_id: "REC: ou_partner.id"

      - step: "Create purchase journal scoped to operating unit A"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name:
            "EVAL: 'Test Vendor Bill OU Purchase Journal %d' %
            env['account.journal'].search_count([])"
          code: "EVAL: 'VBOJ%d' % env['account.journal'].search_count([])"
          type: "purchase"
          operating_unit_ids:
            - - 6
              - 0
              - - "REC: ou.id"

      - step: "Create vendor bill with operating unit A"
        action: "create"
        model: "vendor_bill"
        save_as: "bill"
        values:
          partner_id: "REC: vendor.id"
          journal_id: "REC: journal.id"
          operating_unit_id: "REC: ou.id"
          invoice_date: "EVAL: datetime.now().date()"
          invoice_line_ids:
            - - 0
              - 0
              - name: "Test Line"
                quantity: 1
                price_unit: 300000.0
                account_id: "REC: expense_account.id"

      - step: "Bill carries the operating unit at creation"
        action: "assert"
        target: "bill"
        asserts:
          operating_unit_id:
            type: "m2o"
            expected: "REC: ou"

      - step: "Post the bill"
        action: "call"
        target: "bill"
        method: "action_post"
        as_user: "base.user_admin"

      - step: "Fetch the generated account move"
        action: "search"
        model: "account.move"
        domain:
          - ["id", "=", "REC: bill.move_id.id"]
        save_as: "move"
        expect_count: 1

      - step: "Move keeps the same operating unit as the bill"
        action: "assert"
        target: "move"
        asserts:
          operating_unit_id:
            type: "m2o"
            expected: "REC: ou"

      - step: "Every move line carries operating unit A"
        action: "search"
        model: "account.move.line"
        domain:
          - ["move_id", "=", "REC: move.id"]
          - ["operating_unit_id", "=", "REC: ou.id"]
        save_as: "ou_lines"
        expect_count: 2

      - step: "No move line carries a different operating unit"
        action: "search"
        model: "account.move.line"
        domain:
          - ["move_id", "=", "REC: move.id"]
          - ["operating_unit_id", "!=", "REC: ou.id"]
        save_as: "wrong_lines"
        expect_count: 0

  - name: "Operating Unit record rule scopes vendor bill visibility"
    steps:
      - step: "Create vendor partner"
        action: "create"
        model: "res.partner"
        save_as: "vendor"
        values:
          name: "Test Vendor Bill OU Partner 2"
          is_company: true

      - step: "Create partner for operating unit A"
        action: "create"
        model: "res.partner"
        save_as: "ou_partner"
        values:
          name: "Test Vendor Bill OU-A Partner 2"

      - step: "Create operating unit A"
        action: "create"
        model: "operating.unit"
        save_as: "ou"
        values:
          name: "Test Vendor Bill OU-A 2"
          code: "VBOUA2"
          partner_id: "REC: ou_partner.id"

      - step: "Create purchase journal scoped to operating unit A"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name:
            "EVAL: 'Test Vendor Bill OU Purchase Journal %d' %
            env['account.journal'].search_count([])"
          code: "EVAL: 'VBOJ%d' % env['account.journal'].search_count([])"
          type: "purchase"
          operating_unit_ids:
            - - 6
              - 0
              - - "REC: ou.id"

      - step: "Create bill with operating unit A"
        action: "create"
        model: "vendor_bill"
        save_as: "bill"
        values:
          partner_id: "REC: vendor.id"
          journal_id: "REC: journal.id"
          operating_unit_id: "REC: ou.id"

      - step: "Create partner for operating unit B"
        action: "create"
        model: "res.partner"
        save_as: "ou_partner_b"
        values:
          name: "Test Vendor Bill OU-B Partner 2"

      - step: "Create operating unit B"
        action: "create"
        model: "operating.unit"
        save_as: "ou_b"
        values:
          name: "Test Vendor Bill OU-B 2"
          code: "VBOUB2"
          partner_id: "REC: ou_partner_b.id"

      - step: "Create user allowed on operating unit A"
        action: "create"
        model: "res.users"
        save_as: "user_a"
        values:
          name: "Vendor Bill OU-A User"
          login: "vendor_bill_ou_a_user"
          groups_id:
            - - 6
              - 0
              - - "REF: base.group_user"
                - "REF: ssi_financial_accounting.bill_user_group"
                - "REF: ssi_financial_accounting_operating_unit.bill_ou_group"
          assigned_operating_unit_ids:
            - - 6
              - 0
              - - "REC: ou.id"

      - step: "Create user allowed on operating unit B only"
        action: "create"
        model: "res.users"
        save_as: "user_b"
        values:
          name: "Vendor Bill OU-B User"
          login: "vendor_bill_ou_b_user"
          groups_id:
            - - 6
              - 0
              - - "REF: base.group_user"
                - "REF: ssi_financial_accounting.bill_user_group"
                - "REF: ssi_financial_accounting_operating_unit.bill_ou_group"
          assigned_operating_unit_ids:
            - - 6
              - 0
              - - "REC: ou_b.id"

      - step: "User of operating unit A can see the bill"
        action: "search"
        model: "vendor_bill"
        as_user: "user_a"
        domain:
          - ["id", "=", "REC: bill.id"]
        save_as: "seen_by_a"
        expect_count: 1

      - step: "User of operating unit B cannot see the bill"
        action: "search"
        model: "vendor_bill"
        as_user: "user_b"
        domain:
          - ["id", "=", "REC: bill.id"]
        save_as: "seen_by_b"
        expect_count: 0
