options:
  auto_refresh: true

setup:
  steps:
    - step: "Get payable account type"
      action: "ref"
      xml_id: "account.data_account_type_payable"
      save_as: "payable_acc_type"

    # `setup:` replays before every scenario in the same transaction (no
    # rollback in between), so a fixed `code` would collide with the
    # previous scenario's record on the 2nd+ replay (code is unique per
    # company). Generate a fresh, never-colliding code/name on each replay.
    - step: "Create payable account"
      action: "create"
      model: "account.account"
      save_as: "account"
      values:
        code: "EVAL: 'VB%d' % env['account.account'].search_count([])"
        name: "Test Vendor Bill Payable"
        user_type_id: "REC: payable_acc_type.id"
        reconcile: true

    - step: "Create purchase journal"
      action: "create"
      model: "account.journal"
      save_as: "journal"
      values:
        name:
          "EVAL: 'Test Vendor Bill Purchase Journal %d' %
          env['account.journal'].search_count([])"
        code: "EVAL: 'VBJ%d' % env['account.journal'].search_count([])"
        type: "purchase"

    - step: "Create vendor bill type"
      action: "create"
      model: "vendor_bill_type"
      save_as: "type"
      values:
        name: "Test Vendor Bill Type"
        code: "/"
        journal_id: "REC: journal.id"
        payable_account_id: "REC: account.id"

    - step: "Create vendor partner"
      action: "create"
      model: "res.partner"
      save_as: "vendor"
      values:
        name: "Test Vendor Bill Partner"
        is_company: true

scenarios:
  - name: "Create vendor bill in draft state"
    steps:
      - step: "Create vendor bill"
        action: "create"
        model: "vendor_bill"
        save_as: "bill"
        values:
          type_id: "REC: type.id"
          partner_id: "REC: vendor.id"
          date: 2024-01-15
          date_due: 2024-02-15
          currency_id: "REF: base.USD"
          pricelist_id: "REF: product.list0"
          journal_id: "REC: journal.id"
          payable_account_id: "REC: account.id"

      - step: "Assert created in draft with no document number yet"
        action: "assert"
        target: "bill"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
          name:
            type: "value"
            expected: "/"

  - name: "Onchange type_id fills journal and payable account"
    steps:
      - step: "Set type_id on a new form"
        action: "form"
        model: "vendor_bill"
        save: false
        ops:
          - set: {type_id: "REC: type"}
          - assert:
              journal_id:
                type: "m2o"
                expected: "REC: journal"
              payable_account_id:
                type: "m2o"
                expected: "REC: account"

  - name: "Onchange duration and date fills date due"
    steps:
      - step: "Create a 7 calendar day duration"
        action: "create"
        model: "base.duration"
        save_as: "duration"
        values:
          name: "Test Vendor Bill Duration 7 Days"
          code: "/"
          relative_delta_days: 7
          number_of_days: 0

      - step: "Set date then duration_id on a new form"
        action: "form"
        model: "vendor_bill"
        save: false
        ops:
          - set: {date: 2024-01-01}
          - set: {duration_id: "REC: duration"}
          - assert:
              date_due:
                type: "value"
                expected: 2024-01-08

  - name: "Compute allowed currency ids from type's manual currency list"
    steps:
      - step: "Create a second vendor bill type with a manual currency allow-list"
        action: "create"
        model: "vendor_bill_type"
        save_as: "manual_currency_type"
        values:
          name: "Test Vendor Bill Type Manual Currency"
          code: "/"
          journal_id: "REC: journal.id"
          payable_account_id: "REC: account.id"
          currency_selection_method: "manual"
          currency_ids:
            - - 6
              - 0
              - - "REF: base.EUR"
                - "REF: base.SGD"

      - step: "Create vendor bill using that type"
        action: "create"
        model: "vendor_bill"
        save_as: "bill"
        values:
          type_id: "REC: manual_currency_type.id"
          partner_id: "REC: vendor.id"
          date: 2024-01-15
          date_due: 2024-02-15
          currency_id: "REF: base.USD"
          pricelist_id: "REF: product.list0"
          journal_id: "REC: journal.id"
          payable_account_id: "REC: account.id"

      - step: "Assert allowed_currency_ids is exactly the manual list"
        action: "assert"
        target: "bill"
        asserts:
          allowed_currency_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "RECORDSET: base.EUR"
              - "RECORDSET: base.SGD"

  - name: "Confirm then approve moves bill from draft to open with a document number"
    steps:
      - step: "Create vendor bill"
        action: "create"
        model: "vendor_bill"
        save_as: "bill"
        values:
          type_id: "REC: type.id"
          partner_id: "REC: vendor.id"
          date: 2024-01-15
          date_due: 2024-02-15
          currency_id: "REF: base.USD"
          pricelist_id: "REF: product.list0"
          journal_id: "REC: journal.id"
          payable_account_id: "REC: account.id"

      - step: "Confirm the bill"
        action: "call"
        target: "bill"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the bill"
        action: "call"
        target: "bill"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert a document number was assigned on open"
        action: "assert"
        target: "bill"
        refresh: true
        asserts:
          name:
            type: "value"
            operator: "not_equals"
            expected: "/"

  - name: "Done moves bill from open to done"
    steps:
      - step: "Create vendor bill"
        action: "create"
        model: "vendor_bill"
        save_as: "bill"
        values:
          type_id: "REC: type.id"
          partner_id: "REC: vendor.id"
          date: 2024-01-15
          date_due: 2024-02-15
          currency_id: "REF: base.USD"
          pricelist_id: "REF: product.list0"
          journal_id: "REC: journal.id"
          payable_account_id: "REC: account.id"

      - step: "Confirm the bill"
        action: "call"
        target: "bill"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Approve the bill"
        action: "call"
        target: "bill"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Finish the bill"
        action: "call"
        target: "bill"
        method: "action_done"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "done"

  - name: "Restart moves bill from reject back to draft"
    steps:
      - step: "Create vendor bill"
        action: "create"
        model: "vendor_bill"
        save_as: "bill"
        values:
          type_id: "REC: type.id"
          partner_id: "REC: vendor.id"
          date: 2024-01-15
          date_due: 2024-02-15
          currency_id: "REF: base.USD"
          pricelist_id: "REF: product.list0"
          journal_id: "REC: journal.id"
          payable_account_id: "REC: account.id"

      - step: "Confirm the bill"
        action: "call"
        target: "bill"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Reject the bill"
        action: "call"
        target: "bill"
        method: "action_reject_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "reject"

      - step: "Restart the bill as validator"
        action: "call"
        target: "bill"
        method: "action_restart"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "draft"

  - name: "Confirm is rejected for a user without the User group"
    steps:
      - step: "Create vendor bill"
        action: "create"
        model: "vendor_bill"
        save_as: "bill"
        values:
          type_id: "REC: type.id"
          partner_id: "REC: vendor.id"
          date: 2024-01-15
          date_due: 2024-02-15
          currency_id: "REF: base.USD"
          pricelist_id: "REF: product.list0"
          journal_id: "REC: journal.id"
          payable_account_id: "REC: account.id"

      - step: "Create a plain internal user without vendor_bill_user_group"
        action: "create"
        model: "res.users"
        save_as: "plain_user"
        values:
          name: "Vendor Bill Plain User"
          login:
            "EVAL: 'vendor_bill_plain_user_%d' %
            env['res.users'].search_count([])"
          groups_id:
            - - 6
              - 0
              - - "REF: base.group_user"

      - step: "Confirm as plain user must be rejected"
        action: "call"
        target: "bill"
        method: "action_confirm"
        as_user: "plain_user"
        expect_error:
          type: "UserError"

  - name: "Done is rejected while bill is still draft"
    steps:
      - step: "Create vendor bill"
        action: "create"
        model: "vendor_bill"
        save_as: "bill"
        values:
          type_id: "REC: type.id"
          partner_id: "REC: vendor.id"
          date: 2024-01-15
          date_due: 2024-02-15
          currency_id: "REF: base.USD"
          pricelist_id: "REF: product.list0"
          journal_id: "REC: journal.id"
          payable_account_id: "REC: account.id"

      - step: "Done while still draft must be rejected"
        action: "call"
        target: "bill"
        method: "action_done"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"

  - name: "Company-scoped user cannot see a bill owned by another company"
    steps:
      - step: "Create another company"
        action: "create"
        model: "res.company"
        save_as: "other_company"
        values:
          name: "Test Vendor Bill Other Company"

      - step: "Create vendor bill owned by the other company"
        action: "create"
        model: "vendor_bill"
        save_as: "bill"
        values:
          type_id: "REC: type.id"
          partner_id: "REC: vendor.id"
          company_id: "REC: other_company.id"
          date: 2024-01-15
          date_due: 2024-02-15
          currency_id: "REF: base.USD"
          pricelist_id: "REF: product.list0"
          journal_id: "REC: journal.id"
          payable_account_id: "REC: account.id"

      - step: "Create a user scoped to the main company via vendor_bill_company_group"
        action: "create"
        model: "res.users"
        save_as: "company_user"
        values:
          name: "Vendor Bill Company User"
          login:
            "EVAL: 'vendor_bill_company_user_%d' %
            env['res.users'].search_count([])"
          company_id: "REC: company.id"
          company_ids:
            - - 6
              - 0
              - - "REC: company.id"
          groups_id:
            - - 6
              - 0
              - - "REF: base.group_user"
                - "ssi_vendor_bill.vendor_bill_company_group"

      - step: "Bill owned by other company is not visible"
        action: "search"
        model: "vendor_bill"
        as_user: "company_user"
        domain:
          - ["id", "=", "REC: bill.id"]
        save_as: "found"
        expect_count: 0

  - name: "Cancelling through the reason wizard moves bill to cancel state"
    steps:
      - step: "Create vendor bill"
        action: "create"
        model: "vendor_bill"
        save_as: "bill"
        values:
          type_id: "REC: type.id"
          partner_id: "REC: vendor.id"
          date: 2024-01-15
          date_due: 2024-02-15
          currency_id: "REF: base.USD"
          pricelist_id: "REF: product.list0"
          journal_id: "REC: journal.id"
          payable_account_id: "REC: account.id"

      - step: "Create a cancel reason"
        action: "create"
        model: "base.cancel_reason"
        save_as: "reason"
        values:
          name: "Test Vendor Bill Cancel Reason"
          code: "/"

      - step: "Cancel through the reason wizard as validator"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "bill"
        as_user: "base.user_admin"
        values:
          cancel_reason_id: "REC: reason"
        method: "action_confirm"
        asserts:
          state:
            type: "value"
            expected: "cancel"
