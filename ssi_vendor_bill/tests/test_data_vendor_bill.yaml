setup:
  steps:
    - step: "Get expense account type"
      action: "ref"
      xml_id: "account.data_account_type_expenses"
      save_as: "expense_acc_type"

    # `setup:` replays before every scenario in the same transaction (no
    # rollback in between), so a fixed `code` would collide with the
    # previous scenario's record on the 2nd+ replay (code is unique per
    # company). Generate a fresh, never-colliding code on each replay
    # from the current record count (EVAL cannot call private/underscore
    # attributes, so a helper like _search_new_account_code is off-limits).
    - step: "Create expense account"
      action: "create"
      model: "account.account"
      save_as: "expense_account"
      values:
        code: "EVAL: 'VBX%d' % env['account.account'].search_count([])"
        name: "Vendor Bill Test Expense"
        user_type_id: "REC: expense_acc_type.id"

    # `name` must vary too: the journal's mail alias is derived from
    # `name`, and alias names are globally unique, so a fixed `name`
    # would also collide on the 2nd+ replay of this setup block.
    - step: "Create purchase journal"
      action: "create"
      model: "account.journal"
      save_as: "journal"
      values:
        name:
          "EVAL: 'Test Vendor Bill Purchase Journal %d' %
          env['account.journal'].search_count([])"
        code: "EVAL: 'PJ%d' % env['account.journal'].search_count([])"
        type: "purchase"

    - step: "Create sale journal"
      action: "create"
      model: "account.journal"
      save_as: "sale_journal"
      values:
        name:
          "EVAL: 'Test Vendor Bill Sale Journal %d' %
          env['account.journal'].search_count([])"
        code: "EVAL: 'SJ%d' % env['account.journal'].search_count([])"
        type: "sale"

    - step: "Create vendor partner"
      action: "create"
      model: "res.partner"
      save_as: "vendor"
      values:
        name: "Test Vendor Bill Partner"
        is_company: true

scenarios:
  - name: "Create Vendor Bill forces in_invoice move_type default"
    steps:
      - step: "Create bill without move_type"
        action: "create"
        model: "vendor_bill"
        save_as: "bill"
        values:
          partner_id: "REC: vendor.id"
          journal_id: "REC: journal.id"

      - step: "Assert defaults applied"
        action: "assert"
        target: "bill"
        asserts:
          move_type:
            type: "value"
            expected: "in_invoice"
          state:
            type: "value"
            expected: "draft"

  - name: "Global rule hides other move types from Vendor Bill"
    steps:
      - step: "Create customer invoice via account.move"
        action: "create"
        model: "account.move"
        save_as: "customer_invoice"
        values:
          move_type: "out_invoice"
          partner_id: "REC: vendor.id"
          journal_id: "REC: sale_journal.id"

      - step: "Create vendor refund via account.move"
        action: "create"
        model: "account.move"
        save_as: "vendor_refund"
        values:
          move_type: "in_refund"
          partner_id: "REC: vendor.id"
          journal_id: "REC: journal.id"

      - step: "Create vendor bill via vendor_bill"
        action: "create"
        model: "vendor_bill"
        save_as: "bill"
        values:
          partner_id: "REC: vendor.id"
          journal_id: "REC: journal.id"

      - step: "Other move types are not visible through vendor_bill"
        action: "search"
        model: "vendor_bill"
        as_user: "base.user_admin"
        domain:
          - ["id", "in", ["REC: customer_invoice.id", "REC: vendor_refund.id"]]
        save_as: "found_others"
        expect_count: 0

      - step: "Vendor bill is visible through vendor_bill"
        action: "search"
        model: "vendor_bill"
        as_user: "base.user_admin"
        domain:
          - ["id", "=", "REC: bill.id"]
        save_as: "found_bill"
        expect_count: 1

  - name: "Inherited workflow methods post and reset to draft"
    options: {auto_refresh: true}
    steps:
      - step: "Create bill with a line"
        action: "create"
        model: "vendor_bill"
        save_as: "bill"
        values:
          partner_id: "REC: vendor.id"
          journal_id: "REC: journal.id"
          invoice_date: "EVAL: datetime.now().date()"
          invoice_line_ids:
            - - 0
              - 0
              - name: "Test Line"
                quantity: 1
                price_unit: 100000.0
                account_id: "REC: expense_account.id"

      - step: "Assert draft"
        action: "assert"
        target: "bill"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Post bill"
        action: "call"
        target: "bill"
        method: "action_post"
        as_user: "base.user_admin"

      - step: "Assert posted"
        action: "assert"
        target: "bill"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "posted"

      - step: "Reset bill to draft"
        action: "call"
        target: "bill"
        method: "button_draft"
        as_user: "base.user_admin"

      - step: "Assert back to draft"
        action: "assert"
        target: "bill"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "draft"

  - name: "Create overrides forced move_type back to vendor bill"
    steps:
      - step: "Create bill trying to force out_invoice"
        action: "create"
        model: "vendor_bill"
        save_as: "bill"
        values:
          move_type: "out_invoice"
          partner_id: "REC: vendor.id"
          journal_id: "REC: journal.id"

      - step: "Assert create() forced in_invoice"
        action: "assert"
        target: "bill"
        asserts:
          move_type:
            type: "value"
            expected: "in_invoice"

  - name: "Restricted user (no account.move ACL) can create and post bill via sudo"
    options: {auto_refresh: true}
    steps:
      - step: "Create restricted vendor-bill user (no account.move ACL)"
        action: "create"
        model: "res.users"
        save_as: "bill_user"
        values:
          name: "Vendor Bill Only User"
          login: "vendor_bill_only_user"
          groups_id:
            - - 6
              - 0
              - - "REF: base.group_user"
                - "REF: ssi_vendor_bill.vendor_bill_user_group"
                - "REF: ssi_vendor_bill.vendor_bill_company_group"

      - step:
          "Create bill as restricted user -> must succeed (sudo materializes
          account.move lines)"
        action: "create"
        model: "vendor_bill"
        as_user: "bill_user"
        save_as: "bill"
        values:
          partner_id: "REC: vendor.id"
          journal_id: "REC: journal.id"
          invoice_date: "EVAL: datetime.now().date()"
          invoice_line_ids:
            - - 0
              - 0
              - name: "Test Line"
                quantity: 1
                price_unit: 50000.0
                account_id: "REC: expense_account.id"

      - step: "Assert draft + audit trail kept (sudo() keeps real user as create_uid)"
        action: "assert"
        target: "bill"
        asserts:
          state:
            type: "value"
            expected: "draft"
          create_uid:
            type: "m2o"
            expected: "REC: bill_user"

      - step: "Post bill as restricted user -> must succeed (posts account.move)"
        action: "call"
        target: "bill"
        method: "action_post"
        as_user: "bill_user"

      - step: "Assert posted"
        action: "assert"
        target: "bill"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "posted"

  - name: "Local group grants ACL + own-company visibility (positive)"
    steps:
      - step: "Create user with local vendor_bill user + company groups"
        action: "create"
        model: "res.users"
        save_as: "company_user"
        values:
          name: "Vendor Bill Company User"
          login: "vendor_bill_company_user"
          company_id: "REC: company.id"
          company_ids:
            - - 6
              - 0
              - - "REC: company.id"
          groups_id:
            - - 6
              - 0
              - - "REF: base.group_user"
                - "REF: ssi_vendor_bill.vendor_bill_user_group"
                - "REF: ssi_vendor_bill.vendor_bill_company_group"

      - step: "Create vendor bill as that user in own company -> succeeds"
        action: "create"
        model: "vendor_bill"
        as_user: "company_user"
        save_as: "bill"
        values:
          partner_id: "REC: vendor.id"
          journal_id: "REC: journal.id"

      - step: "Own-company vendor bill is visible to the user"
        action: "search"
        model: "vendor_bill"
        as_user: "company_user"
        domain:
          - ["id", "=", "REC: bill.id"]
        save_as: "found_own"
        expect_count: 1

  - name: "Record rule hides other-company vendor bill from company user (negative)"
    steps:
      - step: "Create a second company"
        action: "create"
        model: "res.company"
        save_as: "company_b"
        values:
          name: "Vendor Bill Company B"
          currency_id: "REC: company.currency_id.id"

      # account.move.company_id is a stored related field of journal_id.company_id,
      # so the only reliable way to place a bill in another company is to give it a
      # journal that belongs to that company.
      - step: "Create purchase journal in company B"
        action: "create"
        model: "account.journal"
        save_as: "journal_b"
        values:
          name:
            "EVAL: 'Test Vendor Bill Company B Journal %d' %
            env['account.journal'].search_count([])"
          code: "EVAL: 'PJB%d' % env['account.journal'].search_count([])"
          type: "purchase"
          company_id: "REC: company_b.id"

      # The sibling glue module ssi_vendor_bill_operating_unit (co-installed in this
      # repo) makes vendor_bill_company_group imply vendor_bill_ou_group, and its
      # record rule lets any OU-group holder see bills with NO operating unit
      # (operating_unit_id = False). Record rules from different groups are OR-ed, so
      # an OU-less bill would leak across companies through that escape. Give this
      # other-company bill an operating unit the searching user is NOT assigned to,
      # so BOTH the company rule and the OU rule exclude it -- isolating on company.
      - step: "Create partner for the other-company operating unit"
        action: "create"
        model: "res.partner"
        save_as: "ou_partner"
        values:
          name: "Vendor Bill Company B OU Partner"

      - step: "Create operating unit for company B bill"
        action: "create"
        model: "operating.unit"
        save_as: "ou_b"
        values:
          name: "Vendor Bill Company B OU"
          code: "EVAL: 'VBCBOU%d' % env['operating.unit'].search_count([])"
          company_id: "REC: company_b.id"
          partner_id: "REC: ou_partner.id"

      - step: "Create vendor bill in company B with an operating unit"
        action: "create"
        model: "vendor_bill"
        save_as: "bill_company_b"
        values:
          partner_id: "REC: vendor.id"
          journal_id: "REC: journal_b.id"
          operating_unit_id: "REC: ou_b.id"

      - step: "Bill really belongs to company B"
        action: "assert"
        target: "bill_company_b"
        asserts:
          company_id:
            type: "m2o"
            expected: "REC: company_b"

      - step: "Create default-company user with local user + company groups"
        action: "create"
        model: "res.users"
        save_as: "main_company_user"
        values:
          name: "Vendor Bill Main Company User"
          login: "vendor_bill_main_company_user"
          company_id: "REC: company.id"
          company_ids:
            - - 6
              - 0
              - - "REC: company.id"
          groups_id:
            - - 6
              - 0
              - - "REF: base.group_user"
                - "REF: ssi_vendor_bill.vendor_bill_user_group"
                - "REF: ssi_vendor_bill.vendor_bill_company_group"

      - step: "Default-company user cannot see the company B vendor bill"
        action: "search"
        model: "vendor_bill"
        as_user: "main_company_user"
        domain:
          - ["id", "=", "REC: bill_company_b.id"]
        save_as: "found_other_company"
        expect_count: 0

  - name: "Internal user without any vendor_bill group is denied read (negative ACL)"
    steps:
      - step: "Create plain internal user (no vendor_bill group)"
        action: "create"
        model: "res.users"
        save_as: "no_group_user"
        values:
          name: "Plain Internal User"
          login: "vendor_bill_no_group_user"
          groups_id:
            - - 6
              - 0
              - - "REF: base.group_user"

      - step: "Create a vendor bill (as default user)"
        action: "create"
        model: "vendor_bill"
        save_as: "bill"
        values:
          partner_id: "REC: vendor.id"
          journal_id: "REC: journal.id"
          # Force no operating unit so the co-installed OU module's account.move
          # default (and its company/OU constraint) never applies to this
          # ACL-only bill on the main-company journal.
          operating_unit_id: false

      - step: "Reading vendor_bill without ACL group raises AccessError"
        action: "call"
        target: "bill"
        method: "read"
        as_user: "no_group_user"
        expect_error:
          type: "AccessError"
